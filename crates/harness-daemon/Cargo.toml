[package]
name = "harness-daemon"
version = "0.1.0"
edition = "2021"
description = "Unified cross-repo hygiene daemon: worktree GC, branch lint, repo health"
license = "MIT OR Apache-2.0"

[[bin]]
name = "hxd"
path = "src/main.rs"

[lib]
name = "harness_daemon"
path = "src/lib.rs"

[dependencies]
# External (only what's actually needed)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }

[dev-dependencies]
tempfile = "3"
